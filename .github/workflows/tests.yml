name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # Commits are published with a hard link, so run on each OS's
        # native filesystem: ext4 on Linux, NTFS on Windows, APFS on macOS.
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q -rs

      - name: Round-trip a table through the command line
        shell: bash
        run: |
          python -m tinydelta create ./ci-orders id:int region:str year:int
          python -m tinydelta append ./ci-orders --file examples/orders.jsonl
          python -m tinydelta overwrite ./ci-orders --file examples/orders.jsonl
          python -m tinydelta read ./ci-orders --version 1
          python -m tinydelta history ./ci-orders
